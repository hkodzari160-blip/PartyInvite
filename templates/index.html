<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دعوت به جشن</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #f8e8ee, #fff8f0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 30px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }

        .photo {
            width: 230px;
            height: 230px;
            object-fit: cover;
            border-radius: 50%;
            border: 7px solid white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 18px;
            line-height: 2;
            color: #444;
            margin: 25px 0;
        }

        .info {
            background: #faf5f7;
            border-radius: 20px;
            padding: 18px;
            margin-top: 20px;
            text-align: right;
        }

        .info p {
            margin: 12px 0;
            font-size: 16px;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
#countdown {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

#countdown div {
    background: #faf5f7;
    border-radius: 15px;
    padding: 12px;
    min-width: 70px;
}

#countdown span {
    display: block;
    font-size: 24px;
    font-weight: bold;
}

#countdown small {
    color: #777;
}
.map-button {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 25px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 16px;
    transition: 0.3s;
}

.map-button:hover {
    transform: scale(1.05);
}
    </style>
</head>

<body>

    <div class="card">

        <div class="title">
            🎉 دعوت به جشن 🎉
        </div>

        <div class="subtitle">
            با افتخار از شما دعوت می‌کنیم
        </div>

        <img
            class="photo"
            src="{{ url_for('static', filename='photo.jpg') }}"
            alt="صاحب جشن"
        >

        <div class="message">
            حضور شما در این جشن<br>
            باعث شادی و خاطره‌ای زیبا برای ما خواهد شد ❤️
        </div>

        <div class="info">

            <p>
                📅 <strong>تاریخ:</strong>
                ۱۴۰۵/۰۶/۰۹
            </p>

            <p>
                🕐 <strong>ساعت:</strong>
                ۱۷:۰۰
            </p>

            <p>
                📍 <strong>مکان:</strong>
                شهرک آزادگان، کوچه وصال یک
            </p>
<a
    class="map-button"
    href="https://www.google.com/maps/search/?api=1&query=شهرک+آزادگان+کوچه+وصال+یک"
    target="_blank"
>
    📍 مشاهده مسیر
</a>
        </div>
<div id="countdown">
    <div>
        <span id="days">0</span>
        <small>روز</small>
    </div>

    <div>
        <span id="hours">0</span>
        <small>ساعت</small>
    </div>

    <div>
        <span id="minutes">0</span>
        <small>دقیقه</small>
    </div>

    <div>
        <span id="seconds">0</span>
        <small>ثانیه</small>
    </div>
</div>

<script>
    const eventDate = new Date("2026-08-31T17:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = eventDate - now;

        if (distance <= 0) {
            document.getElementById("countdown").innerHTML =
                "🎉 جشن شروع شده است! 🎉";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );
        const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) /
            (1000 * 60)
        );
        const seconds = Math.floor(
            (distance % (1000 * 60)) / 1000
        );

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
        <div class="footer">
            💌 منتظر دیدار شما هستیم
        </div>

    </div>

</body>
</html>
